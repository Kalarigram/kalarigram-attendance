<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#7a2e12">
<title>Kalarigram Attendance</title>
<style>
  :root { --bg:#faf6f0; --card:#fff; --ink:#2b1d14; --muted:#7d6a5c; --brand:#7a2e12; --ok:#2f7d32; --line:#e6dccf; }
  * { box-sizing:border-box; }
  body { margin:0; font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--brand); color:#fff; position:sticky; top:0; z-index:2; }
  header h1 { font-size:18px; margin:0; }
  #status { font-size:13px; opacity:.9; }
  #gear { background:none; border:0; color:#fff; font-size:20px; padding:4px 8px; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h2 { font-size:16px; color:var(--muted); font-weight:600; margin:4px 0 12px; }
  .btn { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:0 0 10px; font:inherit; color:inherit; }
  .btn small { display:block; color:var(--muted); font-size:14px; }
  .btn.last { border-color:var(--brand); box-shadow:0 0 0 2px rgba(122,46,18,.15); }
  .bar { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .bar button { background:none; border:1px solid var(--line); border-radius:10px; padding:8px 12px; font:inherit; font-size:15px; }
  .bar small { display:block; color:var(--muted); font-size:13px; }
  input { width:100%; font:inherit; font-size:22px; padding:14px 16px; border:2px solid var(--line); border-radius:14px; background:#fff; outline:none; }
  input:focus { border-color:var(--brand); }
  ul { list-style:none; padding:0; margin:12px 0 0; }
  li button { display:flex; justify-content:space-between; align-items:center; width:100%; padding:18px 16px; margin-bottom:8px; font:inherit; font-size:20px; background:var(--card); border:1px solid var(--line); border-radius:14px; text-align:left; color:inherit; }
  li button span.id { font-size:13px; color:var(--muted); }
  li button.done { background:#eaf5ea; border-color:#bcdcbc; }
  li button.done span.id::after { content:"  ✓"; color:var(--ok); font-size:20px; }
  .empty { color:var(--muted); text-align:center; padding:24px 0; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(120px); background:var(--ok); color:#fff; padding:16px 22px; border-radius:14px; font-size:20px; transition:transform .2s; max-width:90vw; text-align:center; z-index:3; }
  #toast.show { transform:translateX(-50%) translateY(0); }
  #toast.warn { background:#9a6a00; }
  #toast.err { background:#a02020; }
  .row { display:flex; gap:8px; }
  .primary { background:var(--brand); color:#fff; border:0; border-radius:14px; padding:14px 20px; font:inherit; }
</style>
</head>
<body>
<header>
  <h1>Kalarigram Attendance</h1>
  <div><span id="status"></span> <button id="gear" title="Settings">⚙</button></div>
</header>

<main>
  <section id="pinView" hidden>
    <h2>Enter kiosk PIN</h2>
    <div class="row">
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="off">
      <button class="primary" id="pinSave">Save</button>
    </div>
  </section>

  <section id="classView" hidden>
    <h2>Select class</h2>
    <div id="classList"></div>
  </section>

  <section id="markView" hidden>
    <div class="bar">
      <button id="back">← Classes</button>
      <div><strong id="className"></strong><small id="count"></small></div>
    </div>
    <input id="search" placeholder="Type your name…" autocomplete="off" autocorrect="off" spellcheck="false">
    <ul id="results"></ul>
  </section>
</main>

<div id="toast"></div>

<script>
/* ===== CONFIG ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzNYz_6yKmLfNtdk7YznjZXDAXdkwLFXmGpDJW9Z3YHyYpp1KInmVjkfoP9zKdA3PzRAA/exec';
const REFRESH_MS = 30 * 60 * 1000; // refresh class/student list every 30 min
const FLUSH_MS = 15 * 1000;        // retry queue every 15 s

/* ===== storage (wrapped: never break the kiosk) ===== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const $ = id => document.getElementById(id);
const today = () => new Date().toLocaleDateString('en-CA'); // yyyy-mm-dd, device local time

let data = LS.get('kg_data', null);  // { classes, students:{classId:[{id,name}]} }
let pin = LS.get('kg_pin', '');
let current = null;                  // selected class
let flushing = false;

/* marked-today set (per device), resets daily */
function marked() {
  const m = LS.get('kg_marked', { date: today(), keys: [] });
  return m.date === today() ? m : { date: today(), keys: [] };
}
function isMarked(cid, sid) { return marked().keys.includes(cid + '|' + sid); }
function addMarked(cid, sid) { const m = marked(); m.keys.push(cid + '|' + sid); LS.set('kg_marked', m); }

/* ===== views ===== */
function show(view) {
  ['pinView', 'classView', 'markView'].forEach(v => $(v).hidden = v !== view);
}

function renderClasses() {
  const list = $('classList');
  list.textContent = '';
  if (!data || !data.classes.length) {
    list.innerHTML = '<p class="empty">Loading classes…</p>';
    return;
  }
  const last = LS.get('kg_lastClass', '');
  data.classes.forEach(c => {
    const b = document.createElement('button');
    b.className = 'btn' + (c.id === last ? ' last' : '');
    b.textContent = c.name;
    const s = document.createElement('small');
    s.textContent = [c.schedule, c.location].filter(Boolean).join(' · ') +
      ` · ${(data.students[c.id] || []).length} enrolled`;
    b.appendChild(s);
    b.onclick = () => openClass(c);
    list.appendChild(b);
  });
}

function openClass(c) {
  current = c;
  LS.set('kg_lastClass', c.id);
  $('className').textContent = c.name;
  $('search').value = '';
  show('markView');
  renderResults();
  $('search').focus();
}

function updateCount() {
  if (!current) return;
  const n = marked().keys.filter(k => k.startsWith(current.id + '|')).length;
  $('count').textContent = `${n} marked today on this device`;
}

function renderResults() {
  const ul = $('results');
  ul.textContent = '';
  const all = (data && data.students[current.id]) || [];
  const q = $('search').value.trim().toLowerCase();
  const hits = q
    ? all.filter(s => {
        const n = s.name.toLowerCase();
        return n.includes(q) || s.id.toLowerCase().includes(q);
      })
    : all;

  if (!hits.length) {
    ul.innerHTML = `<p class="empty">${all.length ? 'No match — check spelling or ask the admin.' : 'No students enrolled in this class yet.'}</p>`;
  }
  hits.slice(0, 40).forEach(s => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    const done = isMarked(current.id, s.id);
    if (done) b.className = 'done';
    const nm = document.createElement('span'); nm.textContent = s.name;
    const id = document.createElement('span'); id.className = 'id'; id.textContent = s.id;
    b.append(nm, id);
    b.onclick = () => mark(s);
    li.appendChild(b);
    ul.appendChild(li);
  });
  updateCount();
}

/* ===== marking: optimistic + queued ===== */
function mark(s) {
  if (isMarked(current.id, s.id)) {
    toast(`${s.name} is already marked today`, 'warn');
    return;
  }
  const rec = {
    entryId: (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)),
    classId: current.id,
    studentId: s.id,
    ts: new Date().toISOString(),
  };
  const q = LS.get('kg_queue', []); q.push(rec); LS.set('kg_queue', q);
  addMarked(current.id, s.id);
  toast(`✓ ${s.name} — present`);
  $('search').value = '';
  renderResults();
  $('search').focus();
  flush();
}

async function flush() {
  if (flushing || !navigator.onLine) return updateStatus();
  const batch = LS.get('kg_queue', []).slice(0, 50);
  if (!batch.length) return updateStatus();
  flushing = true;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // simple request → no CORS preflight
      body: JSON.stringify({ action: 'attendance', pin, records: batch }),
    });
    const out = await res.json();
    if (out.ok) {
      const done = new Set(out.saved);
      LS.set('kg_queue', LS.get('kg_queue', []).filter(r => !done.has(r.entryId)));
    } else if (out.error === 'bad pin') {
      askPin();
    }
  } catch (e) { /* offline or slow — stays queued */ }
  flushing = false;
  updateStatus();
  if (LS.get('kg_queue', []).length && navigator.onLine) setTimeout(flush, 3000);
}

/* ===== data load ===== */
async function load() {
  try {
    const res = await fetch(`${API_URL}?action=all&pin=${encodeURIComponent(pin)}`);
    const out = await res.json();
    if (out.ok) {
      data = { classes: out.classes, students: out.students };
      LS.set('kg_data', data);
      if (!$('classView').hidden) renderClasses();
      if (!$('markView').hidden && current) {
        current = data.classes.find(c => c.id === current.id) || current;
        renderResults();
      }
    } else if (out.error === 'bad pin') {
      askPin();
    }
  } catch (e) { /* keep using cached list */ }
  updateStatus();
}

/* ===== misc UI ===== */
let toastTimer;
function toast(msg, kind = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = kind, 1800);
}

function updateStatus() {
  const n = LS.get('kg_queue', []).length;
  $('status').textContent = (navigator.onLine ? '' : 'Offline · ') + (n ? `${n} to sync` : 'Synced');
}

function askPin() {
  pin = '';
  LS.set('kg_pin', '');
  show('pinView');
  $('pinInput').value = '';
  $('pinInput').focus();
}

$('pinSave').onclick = () => {
  const v = $('pinInput').value.trim();
  if (!v) return;
  pin = v; LS.set('kg_pin', v);
  show('classView'); renderClasses(); load(); flush();
};
$('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('pinSave').click(); });
$('search').addEventListener('input', renderResults);
$('search').addEventListener('keydown', e => {
  // Enter marks the only match
  if (e.key === 'Enter') { const b = $('results').querySelectorAll('li button'); if (b.length === 1) b[0].click(); }
});
$('back').onclick = () => { current = null; show('classView'); renderClasses(); };
$('gear').onclick = () => {
  const c = prompt('Type "refresh" to reload the student list, or "pin" to change the PIN');
  if (c === 'refresh') { load(); toast('Refreshing…'); }
  if (c === 'pin') askPin();
};

window.addEventListener('online', () => { flush(); load(); });
window.addEventListener('offline', updateStatus);
document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });
setInterval(flush, FLUSH_MS);
setInterval(load, REFRESH_MS);

/* ===== start ===== */
// PIN is optional: only asked for if the API says one is required
show('classView'); renderClasses(); load(); flush();
updateStatus();
</script>
</body>
</html>
